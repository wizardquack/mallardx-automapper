<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Map</title>
  <link rel="stylesheet" href="mapper.css">
</head>
<body>
  <header class="map-header">
    <select class="area-select" title="Area"></select>
    <span class="room-name">Not mapping</span>
    <span class="spacer"></span>
    <button class="z-down" type="button" title="Down a floor">▼</button>
    <button class="z-up"   type="button" title="Up a floor">▲</button>
    <button class="labels-toggle" type="button" title="Show room and region names">Aa</button>
    <button class="legend-toggle" type="button" title="Legend">?</button>
    <button class="recenter" type="button" title="Recenter on me">⌖</button>
    <button class="zoom-out" type="button" title="Zoom out">−</button>
    <button class="zoom-in"  type="button" title="Zoom in">+</button>
  </header>
  <div class="search-bar">
    <input class="search-box" type="text" placeholder="Find a room… (Enter to walk)" />
    <div class="search-results" hidden></div>
  </div>
  <div class="canvas-wrap">
    <canvas class="map-canvas"></canvas>
    <div class="legend" hidden></div>
    <div class="pocket-bar" hidden>
      <span class="pocket-bar-label" title="Move highlighted rooms to area?">Move highlighted rooms to area?</span>
      <span class="bar-actions">
        <button class="pocket-confirm">Move</button>
        <button class="pocket-cancel">Cancel</button>
      </span>
    </div>
    <div class="link-bar" hidden>
      <span class="link-bar-label"></span>
      <span class="bar-actions">
        <button class="link-both" type="button">Link both ways</button>
        <button class="link-one" type="button">One way</button>
        <button class="link-dismiss" type="button" title="Dismiss">✕</button>
      </span>
    </div>
    <div class="learn-panel" hidden>
      <div class="learn-head">
        <span class="learn-title">Learn mode — mark the room’s name &amp; exits lines</span>
        <button class="learn-close" type="button" title="Close">✕</button>
      </div>
      <div class="learn-lines"></div>
      <div class="learn-out" hidden>
        <div class="learn-field"><span class="learn-label">Room-name pattern</span><code class="learn-name-pat"></code></div>
        <div class="learn-field"><span class="learn-label">Exits pattern</span><code class="learn-exits-pat"></code></div>
        <p class="learn-hint">Copy these into <b>Settings → Automapper</b> (Room-name / Exits pattern), turn on <b>Non-GMCP capture</b>, then reload the plugin.</p>
      </div>
    </div>
  </div>
  <script type="module" src="mapper.js"></script>
</body>
</html>
